version: 2

project_name: loadwave

before:
  hooks:
    # The dashboard is embedded at compile time, so a stale or missing build
    # would silently ship a binary whose UI does not match its API.
    - go mod tidy

builds:
  - id: loadwave
    main: ./cmd/loadwave
    binary: loadwave
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/SnowyFoxStudios/LoadWave/internal/buildinfo.version={{ .Version }}
      - -X github.com/SnowyFoxStudios/LoadWave/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/SnowyFoxStudios/LoadWave/internal/buildinfo.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md
      - examples/**/*

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Performance
      regexp: '^perf(\(.+\))?!?:'
      order: 2
    - title: Other
      order: 99
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request

release:
  draft: true
  prerelease: auto
  footer: |
    ## Getting started

    ```sh
    loadwave run test.yaml --ui
    ```

    Every archive contains a single binary with the dashboard embedded, plus
    the example configurations. See the README for the distributed setup.
