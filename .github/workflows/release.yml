name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the changelog from the commits since the
          # previous tag, which needs the full history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: "26.7.0"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The dashboard is embedded at compile time, so it has to exist before
      # GoReleaser starts any of its cross-platform builds.
      - name: Build the dashboard
        run: |
          npm --prefix web ci
          npm --prefix web run build
          # Vite empties web/dist before writing to it, which deletes the
          # tracked .gitkeep placeholder along with everything else. That
          # leaves the checkout "dirty" as far as git is concerned, and
          # GoReleaser refuses to release from a dirty tree.
          git checkout -- web/dist/.gitkeep

      # Pinned to a commit rather than the v7 tag: this job runs with
      # contents: write, and a mutable tag can be moved to point at
      # different code later — a commit hash cannot.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
