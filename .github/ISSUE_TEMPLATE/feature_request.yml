name: Feature request
description: Suggest something LoadWave should be able to do.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to find out about your system that LoadWave cannot
        currently tell you? Describe the situation rather than the feature —
        there may be a better answer than the one you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: If you have a concrete design, sketch the configuration or API.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Workarounds you have used, or how other tools handle this.
