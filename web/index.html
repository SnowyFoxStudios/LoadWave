<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="LoadWave — distributed load testing with a live dashboard" />
    <title>LoadWave</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M2 20c4 0 4-8 8-8s4 8 8 8 4-8 8-8 4 8 4 8' fill='none' stroke='%232a78d6' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script>
      // Applied before first paint so a dark-mode reload never flashes white.
      // Mirrors the resolution order in useTheme: explicit choice, then OS.
      (function () {
        try {
          var saved = localStorage.getItem('loadwave.theme');
          if (saved === 'light' || saved === 'dark') {
            document.documentElement.dataset.theme = saved;
          }
        } catch {
          /* private browsing blocks storage; the OS setting still applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
